[profile.default]
src = "src"
test = "test"
libs = ["lib"]
auto_detect_remappings = false
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
dynamic_test_linking = false
fs_permissions = [{ access = "read", path = "./out" }, { access = "read", path = "./config" }, { access = "read-write", path = "./.local/ops" }]

[invariant]
runs = 64
depth = 64
fail_on_revert = true
show_metrics = true

[rpc_endpoints]
unison_script = "${UNISON_SCRIPT_RPC}"
